[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weyl"
version = "0.2.0"
description = "Herramienta de diffing semántico y comparación estructural (por bloques y funciones) entre códigos C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@4b99a428c28ab5f3c3013b770b9692ade6182fc2",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/weyl"
Repository = "https://github.com/INGCOM-UNRN-P1/weyl.git"
Issues = "https://github.com/INGCOM-UNRN-P1/weyl/issues"

[project.scripts]
weyl = "weyl.cli:main"

[project.entry-points."ripley.plugins"]
semantic_diff = "weyl.ripley_plugin:WeylPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/weyl"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.metadata]
# yutani es una referencia directa a git (nunca por nombre en PyPI).
allow-direct-references = true
