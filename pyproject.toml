[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weyl"
version = "0.1.0"
description = "Herramienta de diffing semántico y comparación estructural AST entre códigos C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
weyl = "weyl.cli:main"

[project.entry-points."ripley.plugins"]
semantic_diff = "weyl.ripley_plugin:WeylPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/weyl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
